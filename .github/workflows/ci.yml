name: CI

# Trunk-Based Development: every pull request is checked before it merges, and main after.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v3
        with:
          install: false
          node-version-file: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm --filter @domy/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        id: e2e
      # T132: a successful retry must not discard the first attempt's failure trace.
      - name: Retain failed Playwright traces
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/**/trace.zip
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: false
      - run: pnpm build
