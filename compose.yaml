services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-domy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-domy}
      POSTGRES_DB: ${POSTGRES_DB:-domy}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  # Web interface to browse the development database: http://localhost:8080
  # (System: PostgreSQL · Server: postgres · the user, password, and database of .env)
  adminer:
    image: adminer:5
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
