packages:
  - apps/*
  - packages/*
# 001/T129: tested transform/loader compatibility beyond upstream's ~0.18.20 range;
# scoped evidence and limitations: specs/001-shipment-registration/dependency-audit-results.md.
overrides:
  "@esbuild-kit/core-utils@3.3.2>esbuild": "0.25.12"
minimumReleaseAgeExclude:
  - "@vitest/mocker@5.0.3"
  - "@vitest/spy@5.0.3"
  - hono@4.13.12
  - resend@6.31.0
  - vitest@5.0.3
  - react-day-picker@10.0.2

# Install scripts allowed to run. Native add-ons of the Docker client used by Testcontainers
# are optional and skipped.
allowBuilds:
  esbuild: true
  cpu-features: false
  protobufjs: false
  ssh2: false
